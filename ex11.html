<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
       //Escreva um programa para imprimir todas as tabuadas de 1 a N. N será informado pelo usuário.

       var num1 = parseInt(prompt("Digite o valor que deseja ver a tabuada: "))
        var num2 = parseInt(prompt("Digite até onde você quer ver a tabuada: "))
        var i = 1
        

        for(i = 1; i <= num2; i++ ){
            var mult = num1 * i
            alert(num1 + " * " + i + " = " + mult + "\n")
        }
    </script>
</head>

</body>
</html>
