    <script>
        //Crie uma bomba relógio (usando somente código - para deixar claro!) cuja contagem regressiva vá de 30 a 0. No final da repetição escreva "EXPLOSÃO".

        var i = 30;

        while (i >= 0) {
            alert(i) 
            i--
