<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        // Faça um algoritmo que calcule e escreva a média aritmética dos dois números inteiros informados pelo usuário e todos os números inteiros entre eles. Considere que o primeiro sempre será menor que o segundo.

        var cont = 0
        var soma = 0
        var num1 = parseInt(prompt("Digite o primeiro número (esse número precisa ser menor que o segundo): "));
        var num2 = parseInt(prompt("Digite o segundo número: "));

        var i = num1

        while(i <= num2){
            soma = soma + i;
            i++
            cont++
        }

        alert(soma / cont);
    </script>
</head>
